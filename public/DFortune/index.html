<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>時光籤 · 日籤 × 時光線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 中性介面色（呼應時光線 token 命名） */
    --page-bg:#FFFFFF;
    --page-bg-2:#FAF9F7;
    --ink:#232733;
    --ink-soft:rgba(35,39,51,0.55);
    --card-bg:#F7F8FA;
    --card-border:#ECEDF1;
    --header-bg:rgba(255,255,255,0.82);
    --input-bg:#FFFFFF;
    /* 硃砂紅，只用在抽籤結果／選中狀態／主要操作 */
    --accent:#C23B34;
    --accent-soft:rgba(194,59,52,0.10);
    --accent-soft-2:rgba(194,59,52,0.18);
    --serif:'Noto Serif TC', serif;
    --sans:'Inter', 'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:var(--sans);
    background:var(--page-bg-2);
    color:var(--ink);
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  button, [role="button"], input, textarea{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    font-family:var(--sans);
  }
  button, [role="button"]{ transition:transform 96ms linear; }
  button:active, [role="button"]:active{ transform:scale(0.96); }

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:transparent;
  }

  /* ---------- topbar ---------- */
  .topbar{
    padding:20px 14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    position:relative;
  }
  .topbar::after{
    content:"";
    position:absolute; left:14px; right:14px; bottom:0;
    height:1px;
    background:var(--card-border);
  }
  .topbar-title{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .topbar h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:18px;
    letter-spacing:3px;
    margin:0;
    color:var(--ink);
    white-space:nowrap;
  }
  .topbar .topbar-sub{
    margin:6px 0 0;
    font-size:9.5px;
    letter-spacing:2px;
    color:var(--accent);
    font-weight:700;
    white-space:nowrap;
  }
  .topbar .topbar-tag{
    margin:3px 0 0;
    font-size:9px;
    letter-spacing:.8px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---------- 年度進度迷你版：與標題並列於 topbar ----------
     沿用原本 .timeline-widget 的紙卡設計（籤紙暖色調不變），
     只是整體縮小尺寸；底部保留一句淡色小字提醒文案。
     永不換行，靠縮小尺寸來塞下。 */
  .timeline-widget--mini{
    margin-top:0;
    flex-shrink:0;
    width:156px;
    padding:8px 11px 8px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(41,37,34,0.10);
  }
  .timeline-widget--mini::before{height:2px;}
  .timeline-widget--mini .tl-year{font-size:10px;}
  .timeline-widget--mini .tl-caption{font-size:7px; letter-spacing:1px;}
  .timeline-widget--mini .tl-percent{font-size:15px; margin:2px 0 6px;}
  .timeline-widget--mini .tl-track-area{padding:0 1px 4px;}
  .timeline-widget--mini .tl-track{height:2px;}
  .timeline-widget--mini .tl-dot{width:6px; height:6px; border-width:1.5px;}
  .timeline-widget--mini .tl-months,
  .timeline-widget--mini .tl-today{display:none;}
  .timeline-widget--mini .tl-stats{font-size:8px; gap:4px; margin-top:5px;}
  .timeline-widget--mini .timeline-caption{
    display:block;
    margin-top:5px;
    padding-top:5px;
    border-top:1px solid rgba(41,37,34,0.08);
    font-size:7.5px;
    font-style:normal;
    letter-spacing:0;
    color:var(--tl-ink-soft);
    opacity:.85;
    white-space:nowrap;
  }


  main{flex:1; padding:4px 18px 100px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- section headings ---------- */
  .eyebrow{
    font-size:11px; letter-spacing:2.5px; color:var(--ink-soft);
    text-transform:uppercase; margin:24px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before, .eyebrow::after{content:""; flex:1; height:1px; background:var(--card-border);}

  /* ---------- 時光線 widget：籤紙卡片 + 細線時間軸 ----------
     這裡刻意用暖紙色（籤紙感），與 App 其餘中性介面區隔開來，
     #C23B34 只用在「已經走過的時間、今日節點、百分比」三處。 */
  .timeline-widget{
    --tl-paper:#F8F3EA;
    --tl-track-bg:#D9D2C8;
    --tl-ink:#292522;
    --tl-ink-soft:#817A72;
    position:relative;
    margin-top:18px;
    padding:20px 20px 18px;
    background:var(--tl-paper);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(41,37,34,0.08);
  }
  .timeline-widget::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--accent);
    opacity:.85;
  }
  .tl-top{
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .tl-year{
    font-family:var(--serif); font-weight:700; font-size:15px;
    color:var(--tl-ink); letter-spacing:1px;
  }
  .tl-caption{
    font-size:10px; letter-spacing:2.5px; color:var(--tl-ink-soft);
  }
  .tl-percent{
    text-align:center; margin:8px 0 18px;
    font-family:var(--serif); font-weight:700; font-size:32px;
    color:var(--accent); letter-spacing:.5px;
  }
  .tl-track-area{
    position:relative; padding:0 2px 38px;
  }
  .tl-track{
    position:relative; height:3px; border-radius:999px;
    background:var(--tl-track-bg);
  }
  .tl-track-fill{
    position:absolute; top:0; left:0; height:100%; border-radius:999px;
    background:var(--accent);
    transition:width .4s ease;
  }
  .tl-dot{
    position:absolute; top:50%; width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    border:2px solid var(--tl-paper);
    box-shadow:0 1px 4px rgba(41,37,34,0.35);
    transform:translate(-50%,-50%);
    transition:left .4s ease;
  }
  .tl-months{
    position:relative; height:12px; margin-top:12px;
  }
  .tl-month-mark{
    position:absolute; top:0; white-space:nowrap;
    font-size:9.5px; letter-spacing:1px; font-weight:600;
    color:var(--tl-ink-soft);
    transform:translateX(-50%);
  }
  .tl-month-mark::before{
    content:"";
    position:absolute; left:50%; top:-9px; width:1px; height:6px;
    background:var(--tl-track-bg);
    transform:translateX(-50%);
  }
  .tl-today{
    position:absolute; top:34px; display:flex; flex-direction:column;
    align-items:center; gap:1px; transform:translateX(-50%);
    transition:left .4s ease;
  }
  .tl-today .caret{font-size:9px; line-height:1; color:var(--accent);}
  .tl-today .label{font-size:9px; letter-spacing:2px; font-weight:700; color:var(--accent);}
  .tl-stats{
    display:flex; justify-content:center; align-items:baseline; gap:8px;
    font-size:11.5px; color:var(--tl-ink-soft);
  }
  .tl-stats b{color:var(--tl-ink); font-weight:700;}
  .tl-stats .tl-sep{color:var(--tl-track-bg);}
  .timeline-caption{
    margin-top:12px; text-align:center;
    font-family:var(--serif); font-size:12.5px; font-style:italic;
    color:var(--tl-ink-soft);
  }

  /* ---------- focus selector: 綜合 獨立膠囊 + 五項分類滑動膠囊 ---------- */
  .focus-row{
    display:flex; align-items:center; gap:7px;
    margin:14px 0 6px;
  }
  .fc-overall{
    flex-shrink:0;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    padding:0 14px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--card-bg);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .2s, color .2s, border-color .2s;
    white-space:nowrap;
  }
  .fc-overall.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:transparent;
  }
  .fc-segment{
    position:relative;
    flex:1;
    height:38px;
    display:flex;
    align-items:center;
    min-width:0;
    padding:3px;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--card-bg);
  }
  .fc-slider{
    position:absolute;
    top:3px; bottom:3px; left:3px;
    width:calc((100% - 6px) / 5);
    border-radius:999px;
    background:var(--accent-soft);
    transition:transform .28s cubic-bezier(.3,.85,.4,1), opacity .2s;
    z-index:0;
  }
  .fc-slider.hidden{opacity:0;}
  .fc-btn{
    position:relative;
    z-index:1;
    flex:1;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    font-family:var(--sans);
    font-size:11px;
    font-weight:700;
    padding:0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    text-align:center;
    white-space:nowrap;
    transition:color .25s;
  }
  .fc-btn.active{color:var(--accent);}

  /* ---------- qian tube (signature element, simplified & glassy) ---------- */
  .tube-stage{
    display:flex; flex-direction:column; align-items:center;
    padding:20px 0 10px;
  }
  .tube-wrap{
    position:relative;
    width:150px; height:190px;
    cursor:pointer;
    user-select:none;
  }
  .sticks{position:absolute; bottom:60px; left:0; right:0; height:112px;}
  .stick{
    position:absolute;
    bottom:0;
    width:11px;
    height:92px;
    left:50%;
    background:linear-gradient(180deg, #F3F0E9, #DCD5C6);
    border:1px solid rgba(41,37,34,0.06);
    border-radius:5px 5px 2px 2px;
    box-shadow:1px 0 2px rgba(35,39,51,0.08);
  }
  .stick::after{
    content:"";
    position:absolute; top:0; left:0; right:0; height:12px;
    background:var(--accent);
    opacity:.85;
    border-radius:5px 5px 0 0;
  }
  .tube{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:118px; height:92px;
    background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(247,248,250,0.75));
    border:1px solid var(--card-border);
    border-radius:20px 20px 26px 26px;
    box-shadow:0 14px 28px rgba(35,39,51,0.10), inset 0 1px 0 rgba(255,255,255,0.7);
    backdrop-filter:blur(6px);
  }
  .tube-accent{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:9px; height:9px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .tube-hint{
    margin-top:16px; font-size:13px; color:var(--ink-soft); text-align:center;
  }
  .tube-hint b{color:var(--accent); font-weight:700;}

  .btn{
    font-family:var(--sans); font-weight:700; font-size:15px;
    border:none; border-radius:16px; padding:14px 20px;
    cursor:pointer; letter-spacing:.5px;
    transition:transform 96ms linear, box-shadow .15s, background .15s;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 18px rgba(194,59,52,0.28);
    width:100%;
  }
  .btn-gold{
    background:var(--accent-soft);
    color:var(--accent);
    box-shadow:none;
  }
  .btn-ghost{
    background:var(--card-bg); color:var(--ink-soft);
    border:1px solid var(--card-border);
  }
  .btn-block{width:100%; margin-top:10px;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{flex:1;}
  .btn:disabled{opacity:.45; cursor:default;}

  /* ---------- already-drawn banner ---------- */
  .done-banner{
    text-align:center; font-size:12px; color:var(--ink-soft);
    margin-top:10px; letter-spacing:1px;
  }

  /* ---------- result card ---------- */
  .paper-card{
    background:var(--card-bg);
    color:var(--ink);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:22px 20px;
    margin-top:16px;
    position:relative;
    box-shadow:0 2px 10px rgba(35,39,51,0.05);
  }
  .qian-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:10px;
  }
  .qian-no{
    font-family:var(--serif); font-weight:700; font-size:19px; color:var(--ink);
  }
  .qian-no span{display:block; font-size:11px; font-weight:500; color:var(--ink-soft); letter-spacing:2px; margin-top:2px;}
  .level-badge{
    font-family:var(--sans); font-weight:700; font-size:12.5px;
    padding:6px 14px; border-radius:999px; border:1px solid transparent;
    white-space:nowrap;
  }
  .tier-good{background:var(--accent-soft); color:var(--accent); border-color:rgba(194,59,52,0.22);}
  .tier-mid{background:var(--card-bg); color:var(--ink-soft); border-color:var(--card-border);}
  .tier-bad{background:rgba(35,39,51,0.06); color:var(--ink); border-color:rgba(35,39,51,0.12);}

  .poem-box{
    display:flex; flex-direction:row-reverse; justify-content:center; gap:14px;
    padding:20px 6px; margin:10px 0 16px;
    background:var(--accent-soft);
    border-radius:14px;
  }
  .poem-line{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-family:var(--serif);
    font-weight:700;
    font-size:19px;
    letter-spacing:6px;
    color:var(--ink);
  }
  .qian-section{margin-bottom:12px;}
  .qian-section h4{
    margin:0 0 4px; font-size:11.5px; letter-spacing:1.5px; color:var(--accent);
    font-weight:700;
  }
  .qian-section p{margin:0; font-size:14.5px; line-height:1.65; color:var(--ink);}

  /* ---------- stars / fortune ---------- */
  .overall-stars{text-align:center; margin:18px 0 4px;}
  .overall-stars .stars{font-size:26px; letter-spacing:3px;}
  .stars .on{color:var(--accent);}
  .stars .off{color:rgba(35,39,51,0.15);}
  .overall-label{font-size:12px; letter-spacing:2px; color:var(--ink-soft); margin-top:4px;}

  .cat-list{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .cat-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px; padding:10px 14px;
  }
  .cat-row.focused{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .cat-name{font-size:13.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .cat-name .tag{font-size:10px; color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 6px;}
  .cat-stars{font-size:15px;}
  .cat-advice{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}

  .quote-card{
    margin-top:24px; padding:18px 20px; border-radius:16px;
    background:var(--card-bg); border:1px solid var(--card-border);
    text-align:center;
  }
  .quote-card p{font-family:var(--serif); font-size:14.5px; line-height:1.6; margin:0; color:var(--ink); font-style:italic;}
  .quote-card span{display:block; margin-top:8px; font-size:11px; letter-spacing:2px; color:var(--ink-soft);}

  /* ---------- book (history) ---------- */
  .book-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; margin-bottom:10px;
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:14px; cursor:pointer;
  }
  .book-item:active{background:var(--accent-soft);}
  .book-left{display:flex; flex-direction:column; gap:3px;}
  .book-date{font-size:11px; color:var(--ink-soft); letter-spacing:1px;}
  .book-title{font-family:var(--serif); font-weight:700; font-size:15px; color:var(--ink);}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:34px; display:block; margin-bottom:10px; opacity:.5;}

  /* ---------- more / tools ---------- */
  .tool-card{
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:18px; padding:18px; margin-bottom:14px;
  }
  .tool-card h3{margin:0 0 6px; font-family:var(--serif); font-size:16px; font-weight:700; color:var(--ink);}
  .tool-card p{margin:0 0 12px; font-size:13px; color:var(--ink-soft); line-height:1.6;}
  input[type=text]{
    width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--card-border);
    background:var(--input-bg); color:var(--ink); font-family:var(--sans); font-size:14px; margin-bottom:8px;
    transition:border-color .15s;
  }
  input[type=text]:focus{outline:none; border-color:var(--accent);}
  input[type=text]::placeholder{color:var(--ink-soft);}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    background:var(--header-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid var(--card-border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; background:none; border:none; color:var(--ink-soft);
    font-family:var(--sans); font-size:11px; padding:7px 0 3px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  .tab-btn .ic{display:flex;}
  .tab-btn .ic svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:stroke .15s;}
  .tab-btn.active{color:var(--accent); font-weight:700;}

  /* ---------- overlays / modals ---------- */
  .overlay, .modal{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(35,39,51,0.4);
    backdrop-filter:blur(3px);
  }
  .overlay.hidden, .modal.hidden{display:none;}
  .modal-panel{
    width:92%; max-width:420px; max-height:84vh; overflow-y:auto;
    background:var(--page-bg);
    border:1px solid var(--card-border);
    border-radius:20px; padding:20px;
    position:relative;
    box-shadow:0 24px 60px rgba(35,39,51,0.2);
  }
  .modal-close{
    position:absolute; top:12px; right:14px; background:none; border:none;
    color:var(--ink-soft); font-size:18px; cursor:pointer;
  }

  /* draw ritual (same glass language as the home canister) */
  .draw-stage{
    position:relative; width:220px; height:280px;
    display:flex; align-items:center; justify-content:center;
  }
  .rite-tube{
    position:absolute; bottom:20px; width:130px; height:100px;
    background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(247,248,250,0.75));
    border:1px solid var(--card-border); border-radius:22px 22px 30px 30px;
    box-shadow:0 18px 34px rgba(35,39,51,0.14), inset 0 1px 0 rgba(255,255,255,0.7);
    backdrop-filter:blur(6px);
  }
  .rite-sticks{position:absolute; bottom:82px; left:0; right:0; height:120px; width:130px; margin:0 auto;}
  .rite-stick{
    position:absolute; bottom:0; left:50%; width:12px; height:104px;
    background:linear-gradient(180deg, #F3F0E9, #DCD5C6);
    border:1px solid rgba(41,37,34,0.06);
    border-radius:5px 5px 2px 2px;
    box-shadow:1px 0 2px rgba(35,39,51,0.08);
  }
  .rite-stick::after{content:""; position:absolute; top:0; left:0; right:0; height:13px; background:var(--accent); opacity:.85; border-radius:5px 5px 0 0;}
  .shaking .rite-tube{animation:shakeTube .5s ease-in-out infinite;}
  .shaking .rite-stick{animation:jitterStick .28s ease-in-out infinite;}
  @keyframes shakeTube{
    0%,100%{transform:rotate(0deg) translateX(0);}
    25%{transform:rotate(-4deg) translateX(-3px);}

const QIAN = [
{id:1,tier:'good',poem:['春風送喜來','百花齊盛開','貴人扶上馬','一舉登金階'],explain:'象徵時機成熟、貴人相助，努力終將見到成果。',advice:'把握眼前機會，勇敢邁出第一步。'},
{id:2,tier:'good',poem:['旭日照長空','祥雲繞碧峰','心誠事必遂','萬里任西東'],explain:'心思純正、方向明確時，做什麼都能順利推進。',advice:'相信自己的判斷，放手去做。'},
{id:3,tier:'good',poem:['龍門一躍過','魚化便成龍','十年寒窗苦','今朝笑春風'],explain:'長期的努力即將開花結果，苦盡甘來。',advice:'別在最後關頭鬆懈，堅持到底。'},
{id:4,tier:'good',poem:['喜鵲枝頭鬧','佳音自遠來','家和萬事順','福祿滿庭階'],explain:'人際與家庭關係和睦，好消息將至。',advice:'多與親近的人分享喜悅，福氣會更綿長。'},
{id:5,tier:'good',poem:['金榜題名時','眾人齊仰之','莫忘來時路','謙遜福自滋'],explain:'成就雖高，仍需謙遜待人，福氣才能長久。',advice:'成功之際更要低調感恩。'},
{id:6,tier:'good',poem:['順風行大船','一路少艱難','但求心中定','自有渡頭安'],explain:'大環境對你有利，只要方向不亂，終能順利抵達目標。',advice:'穩住方向，不必事事憂心。'},
{id:7,tier:'good',poem:['花開滿樹紅','蜂蝶自然逢','但存真心在','何愁事不成'],explain:'只要用心經營，機會與貴人自然會出現。',advice:'專注把眼前的事做好，其餘水到渠成。'},
{id:8,tier:'good',poem:['豐年稻穗垂','倉廩自然肥','一分耕耘去','十分收穫歸'],explain:'過去的付出將有豐厚回報，收成在即。',advice:'好好清點與規劃這波成果，勿浪費。'},
{id:9,tier:'good',poem:['春筍破土出','節節向天青','初時雖弱小','終見凌雲形'],explain:'剛起步時力量尚小，但方向正確，潛力可期。',advice:'打好基礎，不急於一時之功。'},
{id:10,tier:'good',poem:['輕舟已過灘','前路漸平寬','莫因舊時難','誤了眼前歡'],explain:'難關已經度過，接下來的路會比想像中順利。',advice:'放下過去的顧慮，輕裝上路。'},

const LEVEL_BY_TIER = {good:null, mid:'中籤', bad:'下籤', worst:'下下籤'}; // good split below
function levelOf(q){
  if(q.tier==='good') return q.id<=8 ? '上上籤' : '上籤';
  if(q.tier==='mid') return '中籤';
  if(q.tier==='bad') return '下籤';
  return '下下籤';
}
function baseStars(q){
  const lv = levelOf(q);
  return {'上上籤':5,'上籤':4,'中籤':3,'下籤':2,'下下籤':1}[lv];
}
function starTier(q){
  const lv = levelOf(q);
  if(lv==='上上籤'||lv==='上籤') return 'good';
  if(lv==='中籤') return 'mid';
  return 'bad';
}

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function todayDisplay(){
  const d = new Date();
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function computeStats(q){
  const base = baseStars(q);
  const stats = {overall: base};
  CATS.forEach(c=>{
    const off = (hashStr(q.id + c.key) % 3) - 1; // -1,0,1
    stats[c.key] = clamp(base + off, 1, 5);
  });
  return stats;
}
function catAdviceFor(q, catKey){
  const bank = CAT_ADVICE[catKey][starTier(q)];
  const idx = hashStr(q.id + catKey + 'adv') % bank.length;
  return bank[idx];
}
function todayQuote(){
  const start = new Date(new Date().getFullYear(),0,0);
  const diff = new Date() - start;
  const dayOfYear = Math.floor(diff / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

/* ============================================================
   時光線 — 把「今天在整年裡的位置」視覺化成一條時光線，
   是「日籤 × 時光線」品牌融合的核心元件。
   設計：籤紙卡片（暖紙色）+ 細線時間軸，#C23B34 只用在
   「已走過的時間、今日節點、百分比」三處，其餘維持低彩度。
============================================================ */
function yearProgress(){
  const now = new Date();
  const year = now.getFullYear();
  const start = new Date(year,0,1);
  const startNext = new Date(year+1,0,1);
  const totalDays = Math.round((startNext-start)/86400000);
  const dayOfYear = Math.floor((now-start)/86400000)+1;
  const percentRaw = Math.max(0.3, Math.min(100, (dayOfYear/totalDays)*100));
  const percent = percentRaw.toFixed(1);
  const remaining = Math.max(0, totalDays - dayOfYear);
  return {year, dayOfYear, totalDays, percent, percentRaw, remaining};
}
// 六個月份標記在時間軸上的精確位置（依實際月曆天數換算百分比，
// 而非平均切分），讓軸線本身具備「精準時間刻度」的說服力。
function monthMarks(year){
  const start = new Date(year,0,1);
  const startNext = new Date(year+1,0,1);
  const totalDays = Math.round((startNext-start)/86400000);
  const months = [
    {label:'JAN', m:0}, {label:'MAR', m:2}, {label:'MAY', m:4},
    {label:'JUL', m:6}, {label:'SEP', m:8}, {label:'DEC', m:11}
  ];
  return months.map(mm => {
    const monthStart = new Date(year, mm.m, 1);
    const offset = Math.round((monthStart-start)/86400000);
    return {label:mm.label, percent: (offset/totalDays)*100};
  });
}
function timelineWidgetHTML(mini){
  const info = yearProgress();
  const marks = monthMarks(info.year);

  const monthsHTML = marks.map(m=>{
    let transform = 'translateX(-50%)';
    if(m.percent < 3) transform = 'translateX(0%)';
    else if(m.percent > 97) transform = 'translateX(-100%)';
    return '<span class="tl-month-mark" style="left:'+m.percent+'%; transform:'+transform+'">'+m.label+'</span>';
  }).join('');

  let todayTransform = 'translateX(-50%)';
  if(info.percentRaw < 4) todayTransform = 'translateX(0%)';
  else if(info.percentRaw > 96) todayTransform = 'translateX(-100%)';

  return ''
    + '<div class="timeline-widget'+(mini?' timeline-widget--mini':'')+'">'
      + '<div class="tl-top"><span class="tl-year">'+info.year+'</span><span class="tl-caption">年 度 進 度</span></div>'
      + '<div class="tl-percent">'+info.percent+'%</div>'
      + '<div class="tl-track-area">'
        + '<div class="tl-track">'
          + '<div class="tl-track-fill" style="width:'+info.percentRaw+'%"></div>'
          + '<div class="tl-dot" style="left:'+info.percentRaw+'%"></div>'
        + '</div>'
        + '<div class="tl-months">'+monthsHTML+'</div>'
        + '<div class="tl-today" style="left:'+info.percentRaw+'%; transform:'+todayTransform+'"><span class="caret">▲</span><span class="label">TODAY</span></div>'
      + '</div>'
      + '<div class="tl-stats"><span>已行 <b>'+info.dayOfYear+'</b> 日</span><span class="tl-sep">·</span><span>尚餘 <b>'+info.remaining+'</b> 日</span></div>'
      + '<div class="timeline-caption">今天，獨一無二、不會重來的一天。</div>'
    + '</div>';
}

let drawTimers = [];
function clearDrawTimers(){ drawTimers.forEach(t=>clearTimeout(t)); drawTimers = []; }

function beginDraw(){
  if(todayEntry()) return;
  const overlay = document.getElementById('drawOverlay');
  const stage = document.getElementById('drawStage');
  const sticksWrap = document.getElementById('riteSticks');
  const flying = document.getElementById('flyingStick');
  const caption = document.getElementById('drawCaption');

  // build rite sticks
  sticksWrap.innerHTML = [-42,-37,-32,-27,-22,-17,-12,-7,-2,3,8,13,18,23,28,33,38,43].map(r=>
    '<div class="rite-stick" style="--r:'+r+'deg; left:calc(50% + '+(r*1.1)+'px)"></div>'
  ).join('');

  flying.className = 'flying-stick';
  flying.style.transition = 'none';
  overlay.classList.remove('hidden');
  stage.classList.add('shaking');
  caption.textContent = '搖籤中…';

  const q = QIAN[Math.floor(Math.random()*QIAN.length)];
  const lv = levelOf(q);
  document.getElementById('fsNo').textContent = '第 '+q.id+' 籤';
  document.getElementById('fsLevel').textContent = lv;

  function finishNow(){
    clearDrawTimers();
    completeDraw(q);
  }
  document.getElementById('skipDraw').onclick = finishNow;

  drawTimers.push(setTimeout(()=>{
    stage.classList.remove('shaking');
    caption.textContent = '一籤躍出…';
    requestAnimationFrame(()=>{
      flying.style.transition = '';
      flying.classList.add('rise');
    });
  }, 1200));

  drawTimers.push(setTimeout(()=>{
    caption.textContent = '緣分已定';
    flying.classList.add('flip');
  }, 1900));

  drawTimers.push(setTimeout(()=>{
    completeDraw(q);
  }, 2600));
}

function completeDraw(q){
  const overlay = document.getElementById('drawOverlay');
  overlay.classList.add('hidden');
  const entry = {
    date: todayStr(),
    qianId: q.id,
    focus: focusCategory,
    stats: computeStats(q),
    ts: Date.now()
  };
  history.unshift(entry);
  saveHistory();
  renderToday();
}

  '這一籤提醒你，勇敢跨出這一步或許正是時候。'
];
document.getElementById('abDraw').onclick = () => {
  const a = document.getElementById('abA').value.trim() || '選項 A';
  const b = document.getElementById('abB').value.trim() || '選項 B';
  const box = document.getElementById('abResultBox');
  box.innerHTML = '<div class="ab-result"><div class="pick loading-dots">搖籤中</div></div>';
  setTimeout(()=>{
    const pick = Math.random() < 0.5 ? a : b;
    const reason = AB_REASONS[Math.floor(Math.random()*AB_REASONS.length)];
    box.innerHTML = '<div class="ab-result"><div class="pick">「 '+pick+' 」</div><div class="why">'+reason+'</div></div>';
  }, 900);
};

/* ============================================================
   AI 解籤（Claude API）
============================================================ */
function openAI(entry){
  const intro = document.getElementById('aiIntro');
  document.getElementById('aiAnswerBox').innerHTML = '';
  document.getElementById('aiQuestion').value = '';
  if(entry){
    const q = QIAN.find(x=>x.id===entry.qianId);
    intro.textContent = '今日抽到「第 '+q.id+' 籤 · '+levelOf(q)+'」，說說你真正想問的事，讓解籤更貼近你的處境。';
  } else {
    intro.textContent = '今天還沒抽籤，籤師會根據一般籤理給你回應，建議先到「今日」抽一支籤。';
  }
  document.getElementById('aiModal').dataset.entryId = entry ? entry.qianId : '';
  document.getElementById('aiModal').dataset.entryDate = entry ? entry.date : '';
  document.getElementById('aiModal').classList.remove('hidden');
}

document.getElementById('aiAsk').onclick = async () => {
  const modal = document.getElementById('aiModal');
  const qid = modal.dataset.entryId;
  const question = document.getElementById('aiQuestion').value.trim();
  const box = document.getElementById('aiAnswerBox');

  if(!question){
    box.innerHTML = '<div class="ai-answer">請先簡單說說你想問的事，籤師才能給出貼近你處境的解讀喔。</div>';
    return;
  }

  box.innerHTML = '<div class="ai-answer"><span class="loading-dots">籤師正在解籤</span></div>';

  let poemInfo = '（使用者今日尚未抽籤，請以一般籤理與生活智慧回應。）';
  if(qid){
    const q = QIAN.find(x=>x.id===parseInt(qid,10));
    if(q){
      poemInfo = '籤號：第'+q.id+'籤，籤級：'+levelOf(q)+'\n籤詩：'+q.poem.join('，')+'\n白話解釋：'+q.explain+'\n今日建議：'+q.advice;
    }
  }

  const sys = '你是一位溫暖、有智慧、講話溫和不誇張的解籤師，服務於「時光籤」——一個提醒人們珍惜時間、把握當下的每日抽籤應用。使用者抽到了一支籤，請根據籤詩內容與使用者的提問，給出貼近生活、務實、溫暖的解讀與建議，適度呼應「今天很珍貴、值得好好把握」的態度，但不要說教。避免使用「絕對」「保證」等武斷字眼，避免醫療、法律、投資等專業斷言，語氣像一位親切的長輩朋友。回覆請用繁體中文，控制在150字以內，分成「解讀」與「建議」兩小段。';
  const userMsg = '籤文資訊：\n'+poemInfo+'\n\n使用者的問題：'+question;

  // 注意：瀏覽器不能直接帶 API Key 呼叫 Anthropic API（無法安全藏金鑰，也常遇到 CORS）。
  // 這裡改成呼叫「你自己架設的後端端點」AI_ENDPOINT，由後端代為呼叫 Anthropic、
  // 金鑰只放在後端環境變數。請求／回應格式約定如下，換掉 AI_ENDPOINT 或自行調整
  // 後端實作即可，前端這段完全不用再改：
  //   POST AI_ENDPOINT  body: { system, message }
  //   回應 JSON: { text: "籤師的回覆文字" }
  // 範例後端（Vercel Serverless Function）另附在 api-example/aiDFortune.js，
  // 部署到你的網站專案後把 AI_ENDPOINT 指到那支 function 的路徑即可。
  try{
    const response = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system: sys, message: userMsg })
    });
    if(!response.ok) throw new Error('endpoint not ready');
    const data = await response.json();
    const text = (data && data.text) ? data.text.trim() : '';
    box.innerHTML = '<div class="ai-answer">'+(text || '籤師暫時沒有回應，稍後再試試看。')+'</div>';
  }catch(e){
    box.innerHTML = '<div class="ai-answer">解籤功能還沒設定好後端服務，暫時無法使用，稍後再試試看。</div>';
  }
};

/* ============================================================
   SHARE CARD (canvas)
============================================================ */
function openShare(entry){
  document.getElementById('shareModal').classList.remove('hidden');
  document.fonts.ready.then(()=> drawShareCanvas(entry));
}
function wrapText(ctx, text, maxWidth){
  const lines = [];
  let line = '';
  for(const ch of text){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}
function drawShareCanvas(entry){
  const q = QIAN.find(x=>x.id===entry.qianId);
  const lv = levelOf(q);
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const ACCENT = '#C23B34';
  const INK = '#232733';
  const INK_SOFT = 'rgba(35,39,51,0.55)';
  const CARD_BG = '#F7F8FA';
  const CARD_BORDER = '#ECEDF1';

  // background — neutral, near-white
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#FAF9F7');
  grad.addColorStop(1,'#FFFFFF');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // hairline border
  ctx.strokeStyle = CARD_BORDER;
  ctx.lineWidth = 1;
  ctx.strokeRect(14.5,14.5,W-29,H-29);

  // title
  ctx.fillStyle = INK;
  ctx.font = '700 20px "Noto Serif TC"';
  ctx.textAlign = 'center';
  ctx.fillText('時 光 籤', W/2, 52);
  ctx.font = '400 11px "Noto Sans TC"';
  ctx.fillStyle = INK_SOFT;
  const yp = yearProgress();
  ctx.fillText(entry.date + ' · ' + yp.year + ' 年第 ' + yp.dayOfYear + ' 天', W/2, 70);

  // level badge — soft accent-tinted pill
  const badgeW = 108, badgeH = 30, badgeX = W/2 - badgeW/2, badgeY = 86;
  ctx.fillStyle = 'rgba(194,59,52,0.10)';
  roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 15);
  ctx.fill();
  ctx.fillStyle = ACCENT;
  ctx.font = '700 14px "Noto Serif TC"';
  ctx.fillText('第 '+q.id+' 籤 · '+lv, W/2, badgeY + 20);

  // card block for poem
  ctx.fillStyle = CARD_BG;
  roundRect(ctx, 40, 138, W-80, 150, 14);
  ctx.fill();
  ctx.strokeStyle = CARD_BORDER;
  ctx.lineWidth = 1;
  roundRect(ctx, 40, 138, W-80, 150, 14);
  ctx.stroke();

  ctx.fillStyle = INK;
  ctx.font = '700 19px "Noto Serif TC"';
  const colW = (W-100)/4;
  q.poem.forEach((line, i) => {
    const x = 40 + 20 + colW*(3-i) + colW/2;
    let y = 168;
    for(const ch of line){
      ctx.fillText(ch, x, y);
      y += 24;
    }
  });

  // explain
  ctx.fillStyle = INK;
  ctx.font = '400 13px "Noto Sans TC"';
  ctx.textAlign = 'left';
  const explainLines = wrapText(ctx, q.explain, W-80);
  let ey = 318;
  explainLines.forEach(l => { ctx.fillText(l, 40, ey); ey += 20; });

  ctx.fillStyle = ACCENT;
  ctx.font = '700 12px "Noto Sans TC"';
  ctx.fillText('今日建議', 40, ey+10);
  ctx.fillStyle = INK;
  ctx.font = '400 13px "Noto Sans TC"';
  const adviceLines = wrapText(ctx, q.advice, W-80);
  let ay = ey+32;
  adviceLines.forEach(l => { ctx.fillText(l, 40, ay); ay += 20; });

  // stars
  ctx.textAlign = 'center';
  ctx.font = '400 20px sans-serif';
  const stars = entry.stats.overall;
  let starStr = '';
  for(let i=1;i<=5;i++) starStr += (i<=stars?'★':'☆');
  ctx.fillStyle = ACCENT;
  ctx.fillText(starStr, W/2, H-46);
  ctx.font = '400 10px "Noto Sans TC"';
  ctx.fillStyle = INK_SOFT;
  ctx.fillText('綜合運勢 · 時光籤', W/2, H-24);
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
document.getElementById('downloadShare').onclick = () => {
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = '今日籤運-'+todayStr()+'.png';

};
