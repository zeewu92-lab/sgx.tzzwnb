name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例如 v1.0.27),務必是從未用過的新版號'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Fix mobile viewport scaling
        run: |
          # Android WebView 對 initial-scale<1 支援不穩定,會導致內容爆版放大,
          # 所以強制改成 1.0。App 本身的排版邏輯已經是「單層縮放交給 viewport meta
          # 統一處理」的設計(見 App.jsx 內部說明),這裡絕對不能再疊加任何額外的
          # zoom/transform/JS 動態縮放,否則會重現「底部裁切」「置中留白」的雙層縮放衝突。
          if grep -q '<meta name="viewport"' dist/index.html; then
            sed -i 's#<meta name="viewport"[^>]*>#<meta name="viewport" content="width=device-width, initial-scale=0.75, minimum-scale=0.75, maximum-scale=2.0, viewport-fit=cover">#' dist/index.html
          else
            sed -i 's#<head>#<head>\n    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">#' dist/index.html
          fi

      - name: Clean and Recreate Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/status-bar
          rm -rf android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "top.timezzw.app",
            "appName": "時光線",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android

          VERSION_NAME=$(echo "$APP_VERSION" | sed 's/^v//')
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Generate app icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p resources
          if [ -f public/icon-512.png ]; then
            convert public/icon-512.png -resize 107% -gravity center -background none -extent 512x512 resources/icon.png
          else
            echo "Icon not found, skipping."
          fi
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#121419' \
            --iconBackgroundColorDark '#121419'

      - name: Sync assets
        run: npx cap sync

      - name: Fix Kotlin conflict
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Verify Keystore (store password)
        run: |
          keytool -list -v -keystore android/app/release-key.jks \
            -storepass "${{ secrets.STORE_PASS }}"

      - name: Verify Keystore (key password)
        run: |
          keytool -list -v -keystore android/app/release-key.jks \
            -storepass "${{ secrets.STORE_PASS }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASS }}"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASS }}

      - name: Upload to Release (as draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
